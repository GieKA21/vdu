<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cbot Upeks</title>
<meta name="description" content="Tanya tarif iklan, syarat pemasangan, dan langganan koran Harian Ujungpandang Ekspres.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2314284F'/%3E%3Cpath d='M9 9v9a7 7 0 0 0 14 0V9' fill='none' stroke='%23FF9A3D' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/gaya.css">
<script type="module" src="assets/aplikasi.js"></script>
</head>
<body>
<svg hidden aria-hidden="true">
  <defs>
    <g id="i-kirim"><path d="M12 19V5M5 12l7-7 7 7"/></g>
    <g id="i-henti"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></g>
    <g id="i-baru"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-kunci"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
    <g id="i-ringkasan"><rect x="4" y="4" width="7" height="9" rx="1.5"/><rect x="13" y="4" width="7" height="5" rx="1.5"/><rect x="13" y="11" width="7" height="9" rx="1.5"/><rect x="4" y="15" width="7" height="5" rx="1.5"/></g>
    <g id="i-dokumen"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></g>
    <g id="i-evaluasi"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></g>
    <g id="i-uji"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></g>
    <g id="i-log"><path d="M4 6h16M4 12h16M4 18h10"/></g>
    <g id="i-akun"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>
    <g id="i-keluar"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></g>
    <g id="i-tutup"><path d="M6 6l12 12M18 6L6 18"/></g>
    <g id="i-salin"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></g>
    <g id="i-mata"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>
    <g id="i-muat"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></g>
    <g id="i-hapus"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></g>
    <g id="i-unduh"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></g>
    <g id="i-chat"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></g>
  </defs>
</svg>

<div id="app" class="app" data-rute="chat">

  <!-- CHAT PUBLIK -->
  <div class="chat" data-tampilan="chat">
    <header class="bilah">
      <a class="merek" href="#/" aria-label="Cbot Upeks">
        <svg class="merek__tanda" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M9 9v9a7 7 0 0 0 14 0V9"/></svg>
        <span>Cbot Upeks</span>
      </a>
      <div class="bilah__aksi">
        <button class="ikon-tombol" id="tombol-reset" type="button" hidden aria-label="Percakapan baru" title="Percakapan baru"><svg viewBox="0 0 24 24"><use href="#i-baru"/></svg></button>
        <a class="tombol tombol--halus" href="#/admin"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-kunci"/></svg>Admin</a>
      </div>
    </header>

    <main class="chat__isi" id="chat-isi">
      <div class="pembuka" id="pembuka">
        <h1 tabindex="-1" id="judul-chat">Tanya soal iklan dan langganan Upeks</h1>
      </div>
      <div class="pesan-daftar" id="pesan-daftar" aria-live="polite"></div>
    </main>

    <div class="dok" id="dok">
      <form class="komposer" id="form-tanya">
        <label class="visually-hidden" for="masukan">Pertanyaan</label>
        <textarea id="masukan" name="pertanyaan" rows="1" maxlength="1000" placeholder="Tulis pertanyaan" enterkeyhint="send" required></textarea>
        <button class="komposer__kirim" id="tombol-kirim" type="submit" aria-label="Kirim"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-kirim"/></svg></button>
      </form>
      <div class="saran" id="saran"></div>
      <p class="dok__catatan" id="rujukan-ringkas"></p>
    </div>
  </div>

  <!-- MASUK -->
  <main class="masuk" data-tampilan="masuk" hidden>
    <form class="masuk__kartu" id="form-masuk">
      <svg class="merek__tanda merek__tanda--besar" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M9 9v9a7 7 0 0 0 14 0V9"/></svg>
      <h1 tabindex="-1" id="judul-masuk">Masuk admin</h1>
      <div class="isian">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" spellcheck="false" required enterkeyhint="next">
      </div>
      <div class="isian">
        <label for="current-password">Kata sandi</label>
        <div class="isian__sandi">
          <input type="password" id="current-password" name="password" autocomplete="current-password" required enterkeyhint="done">
          <button class="ikon-tombol" type="button" id="lihat-sandi" aria-label="Tampilkan kata sandi" aria-pressed="false"><svg viewBox="0 0 24 24"><use href="#i-mata"/></svg></button>
        </div>
      </div>
      <p class="pesan-form" id="pesan-masuk" role="alert"></p>
      <button class="tombol tombol--utama tombol--penuh" type="submit" id="kirim-masuk">Masuk</button>
      <a class="tautan" href="#/">Kembali ke chat</a>
    </form>
  </main>

  <!-- ADMIN -->
  <div class="admin" data-tampilan="admin" hidden>
    <nav class="rel" aria-label="Menu admin">
      <a class="merek" href="#/admin" aria-label="Cbot Upeks, ringkasan">
        <svg class="merek__tanda" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M9 9v9a7 7 0 0 0 14 0V9"/></svg>
        <span>Cbot Upeks</span>
      </a>
      <ul class="rel__menu">
        <li><a href="#/admin" data-menu="ringkasan"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-ringkasan"/></svg><span>Ringkasan</span></a></li>
        <li><a href="#/admin/dokumen" data-menu="dokumen"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-dokumen"/></svg><span>Dokumen</span></a></li>
        <li><a href="#/admin/evaluasi" data-menu="evaluasi"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-evaluasi"/></svg><span>Evaluasi</span></a></li>
        <li><a href="#/admin/uji" data-menu="uji"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-uji"/></svg><span>Uji</span></a></li>
        <li><a href="#/admin/log" data-menu="log"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-log"/></svg><span>Log</span></a></li>
        <li><a href="#/admin/akun" data-menu="akun"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-akun"/></svg><span>Akun</span></a></li>
      </ul>
      <div class="rel__kaki">
        <a href="#/"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chat"/></svg><span>Buka chat</span></a>
        <button type="button" id="tombol-keluar"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-keluar"/></svg><span>Keluar</span></button>
      </div>
    </nav>
    <main class="admin__isi">
      <header class="admin__kepala">
        <h1 tabindex="-1" id="judul-admin">Ringkasan</h1>
        <div class="admin__aksi" id="aksi-admin"></div>
      </header>
      <div id="halaman-admin"></div>
    </main>
  </div>
</div>

<dialog class="lembar" id="dialog" closedby="any" aria-labelledby="dialog-judul">
  <header class="lembar__kepala">
    <h2 id="dialog-judul"></h2>
    <button class="ikon-tombol" type="button" data-tutup aria-label="Tutup"><svg viewBox="0 0 24 24"><use href="#i-tutup"/></svg></button>
  </header>
  <div class="lembar__isi" id="dialog-isi"></div>
</dialog>

<div class="roti" id="roti" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem;font-family:sans-serif">Cbot Upeks memerlukan JavaScript.</p></noscript>
</body>
</html>
